---
- name: Wait for VMs to be reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.raw: test -f /var/lib/cloud/instance/boot-finished
      retries: 30
      delay: 10
      register: cloud_init_result
      until: cloud_init_result.rc == 0
      changed_when: false

- name: Common setup
  hosts: all
  become: true
  roles:
    - common

- name: Database setup
  hosts: db_servers
  become: true
  roles:
    - db

- name: Web application setup
  hosts: workers
  become: true
  roles:
    - webapp
    - nginx
