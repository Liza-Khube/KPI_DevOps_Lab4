---
- name: Set system hostname for Worker
  ansible.builtin.hostname:
    name: worker

- name: Fix sudo warning for Worker
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: '127.0.1.1 worker'
    state: present

- name: Create app system user
  ansible.builtin.user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create operator user
  ansible.builtin.user:
    name: operator
    shell: /bin/bash
    create_home: true
    password: "{{ default_user_password | password_hash('sha512', 'mywebappSalt') }}"
    update_password: always
    state: present

- name: Configure operator sudo rules
  template:
    src: sudoers_operator.j2
    dest: /etc/sudoers.d/operator
    validate: 'visudo -cf %s'
    mode: '0440'

- name: Install Node.js
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: '{{ app_dir }}'
    state: directory
    owner: root
    group: app
    mode: '0750'

- name: Create config directory
  ansible.builtin.file:
    path: '{{ app_config_dir }}'
    state: directory
    owner: root
    group: app
    mode: '0750'

- name: Copy application source files
  ansible.builtin.copy:
    src: ../../../../mywebapp/
    dest: /opt/mywebapp/
    owner: app
    group: app

- name: Install npm dependencies
  community.general.npm:
    path: '{{ app_dir }}'
    state: present

- name: Fix app directory permissions after npm install
  ansible.builtin.file:
    path: '{{ app_dir }}/node_modules'
    state: directory
    owner: app
    group: app
    mode: '0750'

- name: Deploy application config from template
  ansible.builtin.template:
    src: config.json.j2
    dest: '{{ app_config_dir }}/config.json'
    owner: root
    group: app
    mode: '0640'
  notify: Restart mywebapp

- name: Deploy mywebapp.service unit
  ansible.builtin.template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart mywebapp

- name: Enable and start mywebapp.service
  ansible.builtin.systemd:
    name: mywebapp.service
    state: started
    enabled: true
    daemon_reload: true
